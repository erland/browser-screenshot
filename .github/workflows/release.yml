name: Release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be semantic versioning, for example v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          image="ghcr.io/${REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release commit
        id: release_commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release_commit.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish release summary
        shell: bash
        run: |
          {
            echo "## Published Browser Screenshot image"
            echo
            echo "- Image: \`${{ steps.version.outputs.image }}\`"
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${{ steps.release_commit.outputs.sha }}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            if [[ "${{ steps.version.outputs.stable }}" == "true" ]]; then
              echo "- Stable release: \`latest\` updated"
            else
              echo "- Prerelease: \`latest\` unchanged"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-plugin:
    name: Build and publish OpenAI plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BROWSER_SCREENSHOT_MCP_URL: ${{ vars.BROWSER_SCREENSHOT_MCP_URL || 'https://browser-screenshot.apphome.one/mcp' }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build Marketplace plugin package
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          npm run plugin:build -- --version "$VERSION" --target marketplace
          mkdir -p build
          (cd build/plugin-marketplace && zip -qr "../browser-screenshot-plugin-${VERSION}.zip" browser-screenshot)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=build/browser-screenshot-plugin-${VERSION}.zip" >> "$GITHUB_OUTPUT"
      - name: Inspect Marketplace plugin archive
        run: |
          unzip -l "${{ steps.plugin.outputs.archive }}"
          unzip -p "${{ steps.plugin.outputs.archive }}" browser-screenshot/plugin.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);if(p.name!=='browser-screenshot'||p.version!=='${{ steps.plugin.outputs.version }}'||p.apps!=null||p.extensions?.['com.openai']?.apps!=null)process.exit(1)})"
          unzip -p "${{ steps.plugin.outputs.archive }}" browser-screenshot/mcp.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const m=JSON.parse(s);if(m.mcpServers?.['browser-screenshot']?.url!=='${BROWSER_SCREENSHOT_MCP_URL}')process.exit(1)})"
          unzip -p "${{ steps.plugin.outputs.archive }}" browser-screenshot/skills/browser-screenshot/SKILL.md >/dev/null
          unzip -p "${{ steps.plugin.outputs.archive }}" browser-screenshot/assets/logo.png >/dev/null
          unzip -p "${{ steps.plugin.outputs.archive }}" browser-screenshot/assets/composer-icon.png >/dev/null
          if unzip -l "${{ steps.plugin.outputs.archive }}" | grep -Eq '\.app\.json|\.codex-plugin/'; then
            echo "Marketplace upload must not contain app bindings or compatibility update manifests." >&2
            exit 1
          fi
      - name: Attach plugin ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.plugin.outputs.archive }}" --clobber
