name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Canonical verification
        env:
          # GitHub-hosted Ubuntu 24.04 disables the user namespace mechanism
          # Chromium needs for its sandbox. The packaged container is the
          # authoritative sandbox runtime check in the next job.
          SKIP_SANDBOX_RUNTIME_TESTS: "1"
        run: npm run verify

      - name: Release gate regression tests
        run: npm run test:release-gate

  container-smoke:
    name: Verify production container
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify image, sandbox, network boundary and readiness
        run: ./scripts/verify-container.sh
